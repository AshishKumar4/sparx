<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc"><title id="title">Training on dew</title><desc id="desc">A Flax model and a sparx objective go to dew&#x27;s trainer, which writes a run record that reloads, serves streams and exports to NIR.</desc><defs><style>@font-face{font-family:SxMono;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:SxSans;font-weight:400;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:SxSans;font-weight:600;src:url(data:font/woff2;base64,) format('woff2');}.sans{font-family:SxSans,Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;}.display{font-family:SxDisplay,Inter, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;}.mono{font-family:SxMono,'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;}text{font-kerning:normal;white-space:pre;}</style><marker id="arrow52514e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1.2 L9,5 L1,8.8 C2.6,6.4 2.6,3.6 1,1.2 Z" fill="#52514e"/></marker></defs><rect x="0.50" y="0.50" width="1199.00" height="559.00" rx="22" fill="#ffffff" stroke="#dcdbd4" stroke-width="1"/><text x="30.00" y="46.00" class="sans" font-size="27" font-weight="600" fill="#0b0b0b" text-anchor="start">Training on dew</text><text x="30.00" y="80.00" class="sans" font-size="19" font-weight="400" fill="#898781" text-anchor="start">sparx supplies the models and objectives; dew runs them</text><rect x="30.00" y="120.00" width="340.00" height="176.00" rx="16" fill="rgba(42,120,214,0.06)" stroke="#2a78d6" stroke-width="1.25"/><text x="54.00" y="162.00" class="sans" font-size="22" font-weight="600" fill="#0b0b0b" text-anchor="start">Model</text><text x="54.00" y="190.00" class="sans" font-size="17" font-weight="400" fill="#898781" text-anchor="start">a Flax module</text><text x="54.00" y="232.00" class="mono" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">sparx.nn</text><text x="130.80" y="232.00" class="sans" font-size="17" font-weight="400" fill="#52514e" text-anchor="start"> layers</text><text x="54.00" y="262.00" class="mono" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">sparx.models</text><rect x="420.00" y="120.00" width="340.00" height="176.00" rx="16" fill="rgba(42,120,214,0.06)" stroke="#2a78d6" stroke-width="1.25"/><text x="444.00" y="162.00" class="sans" font-size="22" font-weight="600" fill="#0b0b0b" text-anchor="start">Objective</text><text x="444.00" y="190.00" class="sans" font-size="17" font-weight="400" fill="#898781" text-anchor="start">loss and evaluation</text><text x="444.00" y="232.00" class="mono" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">SpikingClassifierObjective</text><text x="444.00" y="262.00" class="mono" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">EPropObjective</text><text x="578.40" y="262.00" class="sans" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">, ...</text><rect x="810.00" y="120.00" width="340.00" height="176.00" rx="16" fill="rgba(82,81,78,0.06)" stroke="#52514e" stroke-width="1.25"/><text x="834.00" y="162.00" class="sans" font-size="22" font-weight="600" fill="#0b0b0b" text-anchor="start">Trainer</text><text x="834.00" y="190.00" class="sans" font-size="17" font-weight="400" fill="#898781" text-anchor="start">dew</text><text x="834.00" y="232.00" class="sans" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">mesh, compiled step</text><text x="834.00" y="262.00" class="sans" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">EMA, checkpoints</text><rect x="420.00" y="350.00" width="340.00" height="176.00" rx="16" fill="rgba(82,81,78,0.06)" stroke="#52514e" stroke-width="1.25"/><text x="444.00" y="392.00" class="sans" font-size="22" font-weight="600" fill="#0b0b0b" text-anchor="start">Run record</text><text x="444.00" y="420.00" class="sans" font-size="17" font-weight="400" fill="#898781" text-anchor="start">JSON by import path</text><text x="444.00" y="462.00" class="mono" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">run.json</text><text x="444.00" y="492.00" class="sans" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">reloads in a new process</text><rect x="30.00" y="350.00" width="340.00" height="176.00" rx="16" fill="rgba(27,175,122,0.06)" stroke="#1baf7a" stroke-width="1.25"/><text x="54.00" y="392.00" class="sans" font-size="22" font-weight="600" fill="#0b0b0b" text-anchor="start">Use</text><text x="54.00" y="420.00" class="sans" font-size="17" font-weight="400" fill="#898781" text-anchor="start">after training</text><text x="54.00" y="462.00" class="mono" font-size="16" font-weight="400" fill="#52514e" text-anchor="start">StreamServer</text><text x="54.00" y="492.00" class="sans" font-size="17" font-weight="400" fill="#52514e" text-anchor="start">NIR export</text><path d="M376,208.0 L412,208.0" fill="none" stroke="#52514e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow52514e)"/><path d="M766,208.0 L802,208.0" fill="none" stroke="#52514e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow52514e)"/><path d="M980.0,302 L980.0,438.0 L768,438.0" fill="none" stroke="#52514e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow52514e)"/><path d="M414,438.0 L378,438.0" fill="none" stroke="#52514e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow52514e)"/></svg>