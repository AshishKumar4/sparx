# Regenerates every reference fixture in its locked environment
# (tools/environments, tools/references.py) and compares each with
# tests/fixtures/SHA256SUMS (tools/regenerate.py): each line says reproduced,
# reproduced to rounding, or differs. A fixture that differs (a trained or
# chaotic reference on another CPU) is kept, and the parity tests that read it
# run against it in sparx's environment. A job fails when a tool fails or a
# parity test does. Run by hand, or by pushing a `references/**` branch.
# Ubuntu 24.04 carries the g++ (13.3.0) and GNU Octave (8.4.0) the fixtures
# were made with.

name: References

on:
  push:
    branches: [ "references/**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  torch:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Environment
      run: |
        python -m pip install uv
        uv venv ../env && VIRTUAL_ENV=../env uv pip sync tools/environments/torch.txt
        uv venv --python 3.12 ../sparx-env && VIRTUAL_ENV=../sparx-env uv pip install -e ".[test]" -c constraints.txt
    - name: Reference checkouts
      run: |
        clone() { git clone -q "https://github.com/$1" "../$2" && git -C "../$2" checkout -q "$3"; }
        clone fangwei123456/spikingjelly spikingjelly c6cb8e46738bf6010cb94904fe5995e66d6451fc
        clone fangwei123456/spikingjelly spikingjelly-2023 6fbee6ed34ed5a65187f4721d1a412f6a526ca6a
        clone Thvnvtos/SNN-delays SNN-delays d169b4e3
        clone pkuxmq/OTTT-SNN ref-ottt c15d5da05eea0c48e1fa837a4f8073297006d93f
        clone uber-research/differentiable-plasticity ref-differentiable-plasticity 5bd29a18
        clone uber-research/backpropamine ref-backpropamine 180c9101
        clone ben-gitdev/fly-gym ref-fly-gym 8d964599119b420de67ee259434d273651a1a76d
        # SNN-delays imports these at module level and never runs them.
        mkdir -p ../stubs/torchaudio/datasets && touch ../stubs/wandb.py
        touch ../stubs/torchaudio/__init__.py ../stubs/torchaudio/datasets/__init__.py
        echo "Spectrogram = MelScale = AmplitudeToDB = Resample = None" > ../stubs/torchaudio/transforms.py
        echo "SPEECHCOMMANDS = object" > ../stubs/torchaudio/datasets/speechcommands.py
    - name: Regenerate
      run: |
        # regenerate PYTHONPATH TOOL [ARGUMENTS]
        regenerate() { env PYTHONPATH="$1" ../env/bin/python tools/regenerate.py --update "${@:2}" || failed="$failed $2"; }
        up=$(realpath ..)
        regenerate "" make_snntorch_fixtures.py
        regenerate "" make_nir_fixtures.py
        regenerate "" make_dcls_fixtures.py
        regenerate "" make_ottt_fixtures.py ../ref-ottt
        regenerate "" make_miconi_fixtures.py ../ref-differentiable-plasticity ../ref-backpropamine
        regenerate "" make_flynn_fixtures.py ../ref-fly-gym
        regenerate "$up/spikingjelly" make_reference_fixtures.py
        regenerate "$up/spikingjelly-2023:$up/SNN-delays:$up/stubs" make_snn_delays_fixtures.py
        test -z "$failed" || { echo "failed:$failed"; exit 1; }
    - name: Parity tests against what differs
      run: |
        changed=$(git diff --name-only -- tests/fixtures | { grep -v SHA256SUMS || true; } | xargs -rn1 basename)
        echo "kept beyond rounding: ${changed:-none}"
        files=$(for f in $changed; do grep -l "$f" tests/*.py || true; done | sort -u)
        test -z "$files" || JAX_PLATFORMS=cpu ../sparx-env/bin/python -m pytest -q $files

  brian2:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Environments
      run: |
        sudo apt-get update -q && sudo apt-get install -yq octave
        python -m pip install uv
        for env in brian2 modelfitting elephant snntoolbox; do
          uv venv "../$env" && VIRTUAL_ENV="../$env" uv pip sync "tools/environments/$env.txt"
        done
        uv venv --python 3.12 ../sparx-env && VIRTUAL_ENV=../sparx-env uv pip install -e ".[test]" -c constraints.txt
    - name: Reference inputs
      run: |
        clone() { git clone -q "https://github.com/$1" "../$2" && git -C "../$2" checkout -q "$3"; }
        clone philshiu/Drosophila_brain_model ref-shiu 91bdd1e7dcf193f3e7ca5a8933497fcef63b7960
        clone AshishKumar4/RNeuralNet-Research ref-RNeuralNet-Research d4b7803a5bbe87747d27a7137cc05a756bef42f7
        curl -fsSL -o ../figure1.m "https://web.archive.org/web/2015id_/http://www.izhikevich.org/publications/figure1.m"
    - name: Regenerate
      run: |
        regenerate() { "../$1/bin/python" tools/regenerate.py --update "${@:2}" || failed="$failed $2"; }
        regenerate brian2 make_brian2_fixtures.py
        regenerate brian2 make_brian2_benchmarks.py
        regenerate brian2 make_shiu_fixtures.py ../ref-shiu
        regenerate brian2 make_rneuralnet_fixtures.py ../ref-RNeuralNet-Research
        regenerate brian2 make_izhikevich_2004_fixtures.py ../figure1.m
        regenerate modelfitting make_gamma_fixtures.py
        regenerate elephant make_elephant_fixtures.py
        regenerate snntoolbox make_snntoolbox_fixtures.py
        test -z "$failed" || { echo "failed:$failed"; exit 1; }
    - name: Parity tests against what differs
      run: |
        changed=$(git diff --name-only -- tests/fixtures | { grep -v SHA256SUMS || true; } | xargs -rn1 basename)
        echo "kept beyond rounding: ${changed:-none}"
        files=$(for f in $changed; do grep -l "$f" tests/*.py || true; done | sort -u)
        test -z "$files" || JAX_PLATFORMS=cpu ../sparx-env/bin/python -m pytest -q $files

  nest:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash -el {0}
    steps:
    - uses: actions/checkout@v4
    - uses: conda-incubator/setup-miniconda@v3
      with:
        environment-file: tools/environments/nest.yml
        activate-environment: sparx-nest
        miniforge-version: latest
    - name: sparx's environment
      # The microcircuit's network is drawn by sparx, and PC-ALM's reference is JAX.
      run: |
        python -m pip install uv
        uv venv --python 3.12 ../sparx-env && VIRTUAL_ENV=../sparx-env uv pip install -e ".[test]" -c constraints.txt
        clone() { git clone -q "https://github.com/$1" "../$2" && git -C "../$2" checkout -q "$3"; }
        clone INM-6/microcircuit-PD14-model microcircuit-PD14-model f79f8ac
        clone SakanaAI/pc-alm ref-pc-alm 660747f61a8a7e547c0ecd2c48c8883380a7d1f6
    - name: Regenerate
      run: |
        regenerate() { python tools/regenerate.py --update "$@" || failed="$failed $1"; }
        regenerate make_nest_fixtures.py
        regenerate make_nest_gap_fixtures.py
        regenerate make_brunel_fixtures.py
        ../sparx-env/bin/python tools/make_microcircuit_fixtures.py export ../microcircuit-network.npz
        regenerate make_microcircuit_fixtures.py nest ../microcircuit-PD14-model ../microcircuit-network.npz
        ../sparx-env/bin/python tools/regenerate.py --update make_pcalm_fixtures.py ../ref-pc-alm || failed="$failed pcalm"
        test -z "$failed" || { echo "failed:$failed"; exit 1; }
    - name: Parity tests against what differs
      run: |
        changed=$(git diff --name-only -- tests/fixtures | { grep -v SHA256SUMS || true; } | xargs -rn1 basename)
        echo "kept beyond rounding: ${changed:-none}"
        files=$(for f in $changed; do grep -l "$f" tests/*.py || true; done | sort -u)
        test -z "$files" || JAX_PLATFORMS=cpu ../sparx-env/bin/python -m pytest -q $files
