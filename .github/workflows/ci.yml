# Installs sparx with dew and the dataset reader on dew's jax (constraints.txt),
# runs dew's three lint gates (ruff, tools/lint_slop.py, pyright) and the CPU
# test suite, dew's Trainer tests included.

name: CI

on:
  push:
    branches: [ "main", "ci/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same ref makes the older run's verdict moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          pyproject.toml
          constraints.txt
    - name: Install
      run: |
        python -m pip install --upgrade pip uv
        pip install -e ".[datasets,test]" -c constraints.txt
    - name: Lint
      run: |
        uvx ruff@0.14.3 check src tests tools benchmarks examples recipes
        python tools/lint_slop.py --package sparx src/sparx tests tools recipes examples benchmarks
    - name: The prose checker is dew's
      # tools/lint_slop.py is dew's file as it is at the commit pyproject.toml pins.
      run: |
        pin=$(sed -n 's|.*AshishKumar4/dew@\([0-9a-f]*\).*|\1|p' pyproject.toml)
        curl -fsSL "https://raw.githubusercontent.com/AshishKumar4/dew/$pin/tools/lint_slop.py" | diff - tools/lint_slop.py
    - name: Type check
      run: uvx pyright@1.1.406 --pythonpath "$(which python)" src/sparx
    - name: Test
      run: JAX_PLATFORMS=cpu python -m pytest -q
