name: Publish to PyPI

# Releases only, as dew publishes: the whole CI runs on the release's commit,
# the wheel and sdist are built from it, that artifact is installed from
# PyPI's index into an empty environment and trained with
# (tools/smoke_wheel.py), and only then does the publish job upload it.
#
# Trusted publishing: PyPI's project `sparxml` names this repository, this
# workflow file and the `pypi` environment as its publisher (for the first
# release, a pending publisher on the account that will own the project), so
# the repository holds no PyPI secret. Only the publish job can mint the
# token, and it runs no code from the repository.
on:
  release:
    types: [published]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The release's tag is the version the package carries
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/sparx/__init__.py)
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "the release is tagged $GITHUB_REF_NAME and sparx.__version__ is $version"; exit 1; }
      - name: Build and check the sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine packaging
          python -m build
          python -m twine check --strict dist/*
          python tools/check_distribution.py dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/

  # The artifact the publish job uploads, not a rebuild of it.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/
      - name: Install the wheel from PyPI's index into an empty environment, compile it and train
        run: python tools/smoke_wheel.py dist/*.whl

  publish:
    needs: [ci, build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sparxml
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
