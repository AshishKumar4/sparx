[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparxml"
dynamic = ["version"]
description = "Spiking neural networks in JAX and Flax"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name="Ashish Kumar Singh", email="ashishkmr472@gmail.com" }
]
license = "MIT"
dependencies = [
    "jax>=0.5",
    "flax>=0.10",
    "optax>=0.2",
    "numpy",
]

[project.optional-dependencies]
# sparx.dew: spiking objectives for dew's Trainer. Dew is not on PyPI, so the
# extra names the repository.
dew = ["dewml @ git+https://github.com/AshishKumar4/dew"]
# sparx.datasets reads the published HDF5 files.
datasets = ["h5py"]
test = ["pytest", "ruff==0.14.3", "h5py"]

[tool.setuptools.dynamic]
version = { attr = "sparx.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sparx = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "C4", "PERF", "PIE", "RET", "SIM", "PGH",
    "ERA", "ANN401", "FBT003", "PLW0120", "RUF", "C901",
]
allowed-confusables = ["×", "γ", "σ", "τ", "θ", "β", "α", "ρ"]

[tool.ruff.lint.isort]
known-first-party = ["sparx"]
combine-as-imports = true
split-on-trailing-comma = false

[tool.pyright]
include = ["src/sparx"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "dew: tests that train through dew's Trainer; skipped when dew is not installed",
]
filterwarnings = [
    'error::DeprecationWarning:sparx($|\.)',
    'error::FutureWarning:sparx($|\.)',
]
